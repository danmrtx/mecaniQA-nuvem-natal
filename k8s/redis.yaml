apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecaniqa-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecaniqa-redis
  template:
    metadata:
      labels:
        app: mecaniqa-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: mecaniqa-redis
  ports:
    - port: 6379
      targetPort: 6379
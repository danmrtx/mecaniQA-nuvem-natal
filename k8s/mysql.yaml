apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecaniqa-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecaniqa-mysql
  template:
    metadata:
      labels:
        app: mecaniqa-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "admin"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mecaniqa-mysql
  ports:
    - port: 3306
      targetPort: 3306